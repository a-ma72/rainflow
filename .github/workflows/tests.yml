name: tests

on:
  push:
    branches: ["master", "rfcnt-v*"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "rfcnt-v*"]
  workflow_dispatch:
    inputs:
      skip_checks_tests:
        description: "Skip checks and the OS/Python test matrix (GitLab SKIP_CHECKS_TESTS)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PIP_NO_COMPILE: 1

jobs:
  checks:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_checks_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify version literals are in sync with CMakeLists.txt
        run: python tools/check_version_sync.py

      - name: Install and test Python package
        working-directory: src/python
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install setuptools wheel pybind11 numpy
          pip install -r requirements.txt
          pip install . --no-build-isolation --no-deps
          pip install pandas
          python -m rfcnt.run_tests

      - name: Verify stub matches compiled module
        working-directory: src/python
        run: |
          pip install mypy
          python -m mypy.stubtest rfcnt.rfcnt --ignore-missing-stub

      - name: Verify docstrings are in sync
        working-directory: src/python
        run: python tools/sync_docstrings.py --check

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Build and test rfc core
        run: |
          cmake -S . -B build -DRFC_EXPORT_PY=0 -DRFC_EXPORT_MEX=0 -DRFC_UNIT_TEST=1
          cmake --build build --target rfc_test rf_embedded_test rf_embedded_flush_test --config Release
          cd build && ctest -C Release -V

  test:
    needs: [checks]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_checks_tests }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # setup.py declares python_requires>=3.9, so 3.7/3.8 are excluded.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and test
        working-directory: src/python
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install setuptools wheel pybind11 numpy
          pip install -r requirements.txt
          pip install . --no-build-isolation --no-deps
          pip install pandas
          python -m rfcnt.run_tests
